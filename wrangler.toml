name = "my-cms-dashboard"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database Bindings
[[d1_databases]]
binding = "CMS_DB"
database_name = "cms-db"
database_id = "7d148ab5-37f1-4721-ba90-bea6472390c2"

[[d1_databases]]
binding = "SEO_DB"
database_name = "seo-keywords-db"
database_id = "b3d0300d-7362-489e-91e9-d2dfece64b63"

[[d1_databases]]
binding = "MAPS_DB"
database_name = "mapsnearme-db"
database_id = "03a74322-da9e-485d-af1c-e73249d19039"

[[d1_databases]]
binding = "PINCODE_DB"
database_name = "pincode-india-db"
database_id = "74274a3f-9fca-42ec-9fbf-c707ffbc56a4"

[[d1_databases]]
binding = "EXAM_DB"
database_name = "examstatus-db"
database_id = "5929f80d-1368-417a-9023-3154807b44f1"

[[d1_databases]]
binding = "EXAM_APAC"
database_name = "examstatus-db-apac"
database_id = "ecd46bbf-6c1b-4147-8ca7-4ea5336fc1d2"

[[d1_databases]]
binding = "SKMTOOLS_DB"
database_name = "skmtools-db"
database_id = "7aef892a-7324-4ccf-ba7f-c1adbe0c9b24"

# KV Namespace Bindings
[[kv_namespaces]]
binding = "NEXUS_CACHE"
id = "e0d8b85873724d2a9779f84b91676e41"

[[kv_namespaces]]
binding = "SESSION"
id = "cdfd21fd5b28429c9276432ed3d15355"

[[kv_namespaces]]
binding = "MAPS_ADS"
id = "5d3d1232c58e489c8aa016664ca22820"

[[kv_namespaces]]
binding = "MAPS_ADS2"
id = "27b1859eb4f542f58bc33459a7d01520"

# Workers AI Binding
[ai]
binding = "AI"

# Cron Triggers (Free tier allows up to 3 triggers active)
# 1. Health checks & Limit counter refresh every 3h
# 2. Auto-detect new CF Pages/Workers + recommendations every 6h
# 3. Log aggregation & pattern detection daily at 2AM UTC
[triggers]
crons = ["0 */3 * * *", "0 */6 * * *", "0 2 * * *"]
